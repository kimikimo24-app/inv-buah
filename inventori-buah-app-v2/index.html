<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Inventori Buah</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#101314" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app-shell">

  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="battery"></div>
  </div>

  <div class="screen" id="screen-dashboard"></div>
  <div class="screen hidden" id="screen-masuk"></div>
  <div class="screen hidden" id="screen-keluar"></div>
  <div class="screen hidden" id="screen-check"></div>
  <div class="screen hidden" id="screen-laporan"></div>

  <button class="fab" id="fab-scan" title="Scan Cepat">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F1210" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
  </button>

  <div class="toast" id="toast"></div>

  <div class="bottom-nav">
    <button class="nav-btn active" data-tab="dashboard">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Dashboard</span>
    </button>
    <button class="nav-btn" data-tab="masuk">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17V3"/><path d="m6 11 6 6 6-6"/><path d="M19 21H5"/></svg>
      <span>Masuk</span>
    </button>
    <button class="nav-btn" data-tab="keluar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="m18 13-6-6-6 6"/><path d="M19 3H5"/></svg>
      <span>Keluar</span>
    </button>
    <button class="nav-btn" data-tab="check">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 2v4"/><path d="M15 2v4"/><path d="m9 14 2 2 4-4"/></svg>
      <span>Check</span>
    </button>
    <button class="nav-btn" data-tab="laporan">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>Laporan</span>
    </button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
